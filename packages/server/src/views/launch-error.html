<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d14;
      color: #c9c9d4;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #16161f;
      border: 1px solid #2a2a3a;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      user-select: none;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #e0e0ee;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #9191a8;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-block;
      padding: 0.6rem 1.5rem;
      background: #3b3bff;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background 0.15s;
    }
    .btn:hover { background: #5555ff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#x26A0;&#xFE0F;</div>
    <h1>{{title}}</h1>
    <p>{{message}}</p>
    {{lobbyButton}}
  </div>
</body>
</html>
