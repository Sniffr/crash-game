<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galaxy Crash — Iframe Embed Harness</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: ui-monospace, 'Cascadia Code', 'Fira Code', monospace;
      background: #0b0e1a;
      color: #cbd5e1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      background: #11172b;
      border-bottom: 1px solid #1e2d4a;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }
    .toolbar label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.1em; }
    .toolbar select, .toolbar input[type="text"] {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 6px;
      color: #e2e8f0;
      font-family: inherit;
      font-size: 12px;
      padding: 6px 10px;
      outline: none;
    }
    .toolbar select:focus, .toolbar input:focus { border-color: #38bdf8; }
    .toolbar button {
      background: linear-gradient(90deg, #22d3ee, #818cf8);
      border: none;
      border-radius: 6px;
      color: #0f172a;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 7px 18px;
      text-transform: uppercase;
      transition: filter 0.15s;
    }
    .toolbar button:hover { filter: brightness(1.12); }
    .field { display: flex; flex-direction: column; gap: 3px; }
    .game-frame {
      flex: 1;
      border: none;
      width: 100%;
      min-height: 0;
    }
    .log {
      background: #0f172a;
      border-top: 1px solid #1e2d4a;
      color: #94a3b8;
      font-size: 11px;
      max-height: 80px;
      overflow-y: auto;
      padding: 8px 16px;
    }
    .log span { color: #22d3ee; }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="field">
      <label>Player</label>
      <select id="player">
        <option value="pid-1" data-token="tok-pid-1" data-currency="EUR">pid-1 · lucky_falcon_42 · EUR</option>
        <option value="pid-2" data-token="tok-pid-2" data-currency="USD">pid-2 · cosmic_otter_7 · USD</option>
        <option value="pid-3" data-token="tok-pid-3" data-currency="BTC">pid-3 · void_walker_3 · BTC</option>
      </select>
    </div>
    <div class="field">
      <label>Game server URL</label>
      <input type="text" id="gameUrl" value="http://localhost:3001" style="width:200px" />
    </div>
    <div class="field">
      <label>Lobby URL</label>
      <input type="text" id="lobbyUrl" value="http://localhost:4000/harness/parent.html" style="width:280px" />
    </div>
    <button id="launchBtn">Launch</button>
  </div>

  <iframe id="gameFrame" class="game-frame" allow="autoplay" sandbox="allow-scripts allow-same-origin allow-forms allow-top-navigation"></iframe>

  <div class="log" id="log"><span>[harness]</span> Ready. Pick a player and click Launch.</div>

  <script>
    const log = document.getElementById('log');
    function addLog(msg) {
      const line = document.createElement('div');
      line.innerHTML = '<span>[harness]</span> ' + msg;
      log.appendChild(line);
      log.scrollTop = log.scrollHeight;
    }

    document.getElementById('launchBtn').addEventListener('click', () => {
      const playerEl = document.getElementById('player');
      const option = playerEl.options[playerEl.selectedIndex];
      const token = option.dataset.token;
      const currency = option.dataset.currency;
      const gameUrl = document.getElementById('gameUrl').value.replace(/\/$/, '');
      const lobbyUrl = document.getElementById('lobbyUrl').value;
      const operator = 'op-stub';

      const launchUrl = `${gameUrl}/launch?operator=${operator}&token=${encodeURIComponent(token)}&currency=${encodeURIComponent(currency)}&lobby_url=${encodeURIComponent(lobbyUrl)}&return_url=${encodeURIComponent(lobbyUrl)}`;
      addLog(`Launching: ${launchUrl}`);
      document.getElementById('gameFrame').src = launchUrl;
    });

    // Handle postMessage from the game iframe
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'lobby') {
        addLog('Received lobby postMessage — navigating to lobby URL.');
        const lobbyUrl = document.getElementById('lobbyUrl').value;
        if (lobbyUrl) window.location.href = lobbyUrl;
      }
    });
  </script>
</body>
</html>
