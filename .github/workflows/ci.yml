name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: crashtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Repos (wallet/server) run their suites against this throwaway Postgres.
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/crashtest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Native deps: rocksdb (session cache) compiles against libsnappy.
      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsnappy-dev

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: |
          for p in shared wallet adapters server client creator; do
            echo "── tsc $p ──"; (cd packages/$p && npx tsc --noEmit)
          done

      - name: Test
        run: |
          for p in shared wallet adapters server client; do
            echo "── test $p ──"; (cd packages/$p && npx vitest run)
          done

      - name: Build client
        run: npm run --workspace=packages/client build

  # PRs: build the image to validate the Dockerfile (no push).
  docker-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t crash-game:ci .

  # main: build + push ghcr.io/stdiox-labs/crash-game:latest → keel rolls it out.
  # Needs a repo secret GHCR_TOKEN = a PAT with `write:packages` for stdiox-labs
  # (the cluster's existing `ghcr-pull` secret pulls it). Falls back to a no-op
  # with a clear message if the secret is absent.
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Gate on the suite: without this, publish races `test` and a red build can
    # still overwrite :latest, which Keel then rolls straight into production.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for GHCR_TOKEN
        id: guard
        run: |
          if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "::warning::GHCR_TOKEN not set — skipping image publish. Add a PAT with write:packages for stdiox-labs to enable it."; echo "ready=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.guard.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - if: steps.guard.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/stdiox-labs/crash-game:latest
      # Odds harvester for Simulate. Run in-cluster as a CronJob; it uploads
      # simulate/fixtures/latest.json to S3, which the app reads.
      - if: steps.guard.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/harvester/Dockerfile
          push: true
          tags: ghcr.io/stdiox-labs/crash-harvester:latest
